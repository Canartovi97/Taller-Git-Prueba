<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de Itinerarios</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <style>
        body {
            background-color: #f4f6f9;
        }

        .main-container {
            min-height: 100vh;
        }

        .panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 25px;
            height: 100%;
        }

        #mapa {
            width: 100%;
            height: 650px;
        }

        .titulo {
            font-weight: 700;
            color: #1f2937;
        }

        .btn-primary {
            background-color: #2563eb;
            border-color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container-fluid main-container py-4">

    <div class="row g-4">

        <!-- =========================
             PANEL IZQUIERDO
        ========================== -->
        <div class="col-lg-4">

            <div class="panel">

                <h2 class="titulo mb-2">
                    Crear itinerario
                </h2>

                <p class="text-muted mb-4">
                    Define los aeropuertos y la intensidad horaria de tu viaje.
                </p>

                <form id="itinerarioForm">

                    <!-- Aeropuerto de salida -->
                    <div class="mb-3">
                        <label for="salida" class="form-label">
                            Aeropuerto de salida
                        </label>

                        <select
                            id="salida"
                            class="form-select"
                            required
                        >
                            <option value="">Selecciona un aeropuerto</option>
                            <option value="BOG">
                                Bogotá - El Dorado (BOG)
                            </option>
                            <option value="MDE">
                                Medellín - José María Córdova (MDE)
                            </option>
                            <option value="CLO">
                                Cali - Alfonso Bonilla Aragón (CLO)
                            </option>
                            <option value="CTG">
                                Cartagena - Rafael Núñez (CTG)
                            </option>
                            <option value="BAQ">
                                Barranquilla - Ernesto Cortissoz (BAQ)
                            </option>
                            <option value="PEI">
                                Pereira - Matecaña (PEI)
                            </option>
                            <option value="SMR">
                                Santa Marta - Simón Bolívar (SMR)
                            </option>
                        </select>
                    </div>

                    <!-- Aeropuerto de llegada -->
                    <div class="mb-3">
                        <label for="llegada" class="form-label">
                            Aeropuerto de llegada
                        </label>

                        <select
                            id="llegada"
                            class="form-select"
                            required
                        >
                            <option value="">Selecciona un aeropuerto</option>
                            <option value="BOG">
                                Bogotá - El Dorado (BOG)
                            </option>
                            <option value="MDE">
                                Medellín - José María Córdova (MDE)
                            </option>
                            <option value="CLO">
                                Cali - Alfonso Bonilla Aragón (CLO)
                            </option>
                            <option value="CTG">
                                Cartagena - Rafael Núñez (CTG)
                            </option>
                            <option value="BAQ">
                                Barranquilla - Ernesto Cortissoz (BAQ)
                            </option>
                            <option value="PEI">
                                Pereira - Matecaña (PEI)
                            </option>
                            <option value="SMR">
                                Santa Marta - Simón Bolívar (SMR)
                            </option>
                        </select>
                    </div>

                    <!-- Intensidad horaria -->
                    <div class="mb-3">
                        <label for="intensidad" class="form-label">
                            Intensidad horaria
                        </label>

                        <select
                            id="intensidad"
                            class="form-select"
                            required
                        >
                            <option value="">
                                Selecciona una intensidad
                            </option>

                            <option value="baja">
                                Baja - 2 a 4 horas/día
                            </option>

                            <option value="media">
                                Media - 5 a 7 horas/día
                            </option>

                            <option value="alta">
                                Alta - 8 a 10 horas/día
                            </option>
                        </select>
                    </div>

                    <!-- Número de días -->
                    <div class="mb-4">
                        <label for="dias" class="form-label">
                            Número de días
                        </label>

                        <input
                            type="number"
                            id="dias"
                            class="form-control"
                            min="1"
                            max="30"
                            value="5"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Generar itinerario
                    </button>

                </form>

                <!-- Resultado -->
                <div
                    id="resultado"
                    class="alert alert-success mt-4 d-none"
                ></div>

            </div>

        </div>


        <!-- =========================
             PANEL DERECHO - MAPA
        ========================== -->
        <div class="col-lg-8">

            <div class="panel">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div>
                        <h2 class="titulo mb-1">
                            Mapa de Colombia
                        </h2>

                        <p class="text-muted mb-0">
                            Selecciona los puntos de tu itinerario.
                        </p>
                    </div>

                    <span class="badge bg-primary">
                        Plotly.js
                    </span>

                </div>

                <div id="mapa"></div>

            </div>

        </div>

    </div>

</div>


<script>

    /*
     * Coordenadas aproximadas de algunos
     * aeropuertos principales de Colombia.
     */
    const aeropuertos = {

        BOG: {
            nombre: "Bogotá",
            lat: 4.7016,
            lon: -74.1469
        },

        MDE: {
            nombre: "Medellín",
            lat: 6.1645,
            lon: -75.4231
        },

        CLO: {
            nombre: "Cali",
            lat: 3.5432,
            lon: -76.3816
        },

        CTG: {
            nombre: "Cartagena",
            lat: 10.4424,
            lon: -75.5130
        },

        BAQ: {
            nombre: "Barranquilla",
            lat: 10.8896,
            lon: -74.7808
        },

        PEI: {
            nombre: "Pereira",
            lat: 4.8127,
            lon: -75.7395
        },

        SMR: {
            nombre: "Santa Marta",
            lat: 11.1196,
            lon: -74.2306
        }
    };


    /*
     * Mapa inicial
     */
    function crearMapa() {

        const puntos = Object.values(aeropuertos);

        const trace = {
            type: "scattergeo",

            mode: "markers+text",

            lat: puntos.map(p => p.lat),

            lon: puntos.map(p => p.lon),

            text: puntos.map(p => p.nombre),

            textposition: "top center",

            marker: {
                size: 9,
                color: "#2563eb",
                line: {
                    color: "white",
                    width: 1
                }
            },

            hovertemplate:
                "<b>%{text}</b><br>" +
                "Latitud: %{lat:.4f}<br>" +
                "Longitud: %{lon:.4f}" +
                "<extra></extra>"
        };


        const layout = {

            geo: {

                scope: "south america",

                projection: {
                    type: "mercator"
                },

                center: {
                    lat: 4.6,
                    lon: -74.1
                },

                lonaxis: {
                    range: [-80, -66]
                },

                lataxis: {
                    range: [-2, 13]
                },

                showland: true,

                landcolor: "#e8f0e8",

                showocean: true,

                oceancolor: "#dceeff",

                showcountries: true,

                countrycolor: "#7d8790",

                coastlinecolor: "#555",

                showlakes: true,

                lakecolor: "#dceeff"
            },

            margin: {
                l: 0,
                r: 0,
                t: 0,
                b: 0
            },

            paper_bgcolor: "white"
        };


        Plotly.newPlot(
            "mapa",
            [trace],
            layout,
            {
                responsive: true,
                displayModeBar: false
            }
        );
    }


    /*
     * Generar itinerario
     */
    document
        .getElementById("itinerarioForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const salida =
                document.getElementById("salida").value;

            const llegada =
                document.getElementById("llegada").value;

            const intensidad =
                document.getElementById("intensidad").value;

            const dias =
                document.getElementById("dias").value;


            if (salida === llegada) {

                alert(
                    "El aeropuerto de salida y llegada deben ser diferentes."
                );

                return;
            }


            const aeropuertoSalida =
                aeropuertos[salida];

            const aeropuertoLlegada =
                aeropuertos[llegada];


            /*
             * Línea de ruta entre salida y llegada
             */
            const ruta = {

                type: "scattergeo",

                mode: "lines+markers",

                lat: [
                    aeropuertoSalida.lat,
                    aeropuertoLlegada.lat
                ],

                lon: [
                    aeropuertoSalida.lon,
                    aeropuertoLlegada.lon
                ],

                line: {
                    color: "#dc2626",
                    width: 4
                },

                marker: {
                    size: 13,
                    color: "#dc2626"
                },

                hoverinfo: "text",

                text: [
                    "Salida: " + aeropuertoSalida.nombre,
                    "Llegada: " + aeropuertoLlegada.nombre
                ]
            };


            /*
             * Actualizamos el mapa
             */
            Plotly.addTraces(
                "mapa",
                ruta
            );


            /*
             * Mostrar resultado
             */
            const resultado =
                document.getElementById("resultado");

            resultado.classList.remove("d-none");

            resultado.innerHTML = `
                <strong>Itinerario generado</strong><br>
                ${aeropuertoSalida.nombre}
                →
                ${aeropuertoLlegada.nombre}
                <br>
                Intensidad:
                <strong>${intensidad}</strong>
                <br>
                Duración:
                <strong>${dias} días</strong>
            `;

        });


    /*
     * Inicializar mapa
     */
    crearMapa();

</script>

</body>
</html>
